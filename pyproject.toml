[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "technocore-sentinel"
version = "0.2.0"
description = "Incremental read-only Technocore monitoring with gated DID onboarding"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "cryptography>=43",
]

[project.scripts]
technocore-sentinel = "technocore_sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/technocore_sentinel"]
