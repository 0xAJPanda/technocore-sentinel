<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Technocore Sentinel one-shot monitoring flow</title>
  <desc id="desc">A bounded Technocore room read flows through strict validation, deterministic safety scanning, severity-filtered reporting, and an atomic secure cursor commit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111c2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="1200" height="470" rx="24" fill="url(#bg)"/>
  <text x="60" y="62" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="30" font-weight="700">One run. New records only. Durable cursor.</text>
  <text x="60" y="94" fill="#8b949e" font-family="system-ui, sans-serif" font-size="17">A read-only security pass designed for cron, systemd, dashboards, and alert bridges.</text>

  <g filter="url(#shadow)" font-family="system-ui, sans-serif">
    <g transform="translate(50 145)">
      <rect width="190" height="180" rx="18" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
      <circle cx="95" cy="44" r="21" fill="#1f6feb"/>
      <text x="95" y="51" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">1</text>
      <text x="95" y="88" text-anchor="middle" fill="#f0f6fc" font-size="18" font-weight="700">Bounded GET</text>
      <text x="95" y="116" text-anchor="middle" fill="#8b949e" font-size="14">Pinned origin</text>
      <text x="95" y="139" text-anchor="middle" fill="#8b949e" font-size="14">Up to 200 records</text>
      <text x="95" y="162" text-anchor="middle" fill="#7ee787" font-size="13">No discovered URLs</text>
    </g>
    <g transform="translate(280 145)">
      <rect width="190" height="180" rx="18" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
      <circle cx="95" cy="44" r="21" fill="#8957e5"/>
      <text x="95" y="51" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">2</text>
      <text x="95" y="88" text-anchor="middle" fill="#f0f6fc" font-size="18" font-weight="700">Validate</text>
      <text x="95" y="116" text-anchor="middle" fill="#8b949e" font-size="14">Schema + ordering</text>
      <text x="95" y="139" text-anchor="middle" fill="#8b949e" font-size="14">Metadata consistency</text>
      <text x="95" y="162" text-anchor="middle" fill="#7ee787" font-size="13">Reject before scan</text>
    </g>
    <g transform="translate(510 145)">
      <rect width="190" height="180" rx="18" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
      <circle cx="95" cy="44" r="21" fill="#bd561d"/>
      <text x="95" y="51" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">3</text>
      <text x="95" y="88" text-anchor="middle" fill="#f0f6fc" font-size="18" font-weight="700">Scan locally</text>
      <text x="95" y="116" text-anchor="middle" fill="#8b949e" font-size="14">6 safety categories</text>
      <text x="95" y="139" text-anchor="middle" fill="#8b949e" font-size="14">Deterministic rules</text>
      <text x="95" y="162" text-anchor="middle" fill="#7ee787" font-size="13">No execution</text>
    </g>
    <g transform="translate(740 145)">
      <rect width="190" height="180" rx="18" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <circle cx="95" cy="44" r="21" fill="#238636"/>
      <text x="95" y="51" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">4</text>
      <text x="95" y="88" text-anchor="middle" fill="#f0f6fc" font-size="18" font-weight="700">Render report</text>
      <text x="95" y="116" text-anchor="middle" fill="#8b949e" font-size="14">Text or JSON</text>
      <text x="95" y="139" text-anchor="middle" fill="#8b949e" font-size="14">Severity filtering</text>
      <text x="95" y="162" text-anchor="middle" fill="#7ee787" font-size="13">URLs redacted</text>
    </g>
    <g transform="translate(970 145)">
      <rect width="180" height="180" rx="18" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <circle cx="90" cy="44" r="21" fill="#1f6feb"/>
      <text x="90" y="51" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">5</text>
      <text x="90" y="88" text-anchor="middle" fill="#f0f6fc" font-size="18" font-weight="700">Commit cursor</text>
      <text x="90" y="116" text-anchor="middle" fill="#8b949e" font-size="14">Atomic + fsync</text>
      <text x="90" y="139" text-anchor="middle" fill="#8b949e" font-size="14">0600 state</text>
      <text x="90" y="162" text-anchor="middle" fill="#7ee787" font-size="13">Before output</text>
    </g>
  </g>

  <g stroke="#58a6ff" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M244 235H272"/>
    <path d="M474 235H502"/>
    <path d="M704 235H732"/>
    <path d="M934 235H962"/>
  </g>

  <g font-family="system-ui, sans-serif">
    <rect x="50" y="363" width="1100" height="62" rx="14" fill="#0d1117" stroke="#30363d"/>
    <text x="75" y="390" fill="#f0f6fc" font-size="15" font-weight="700">Recovery path</text>
    <text x="75" y="412" fill="#8b949e" font-size="14">Only an empty saved-cursor response can trigger one bounded head GET; contradictory state fails closed.</text>
    <text x="1118" y="401" text-anchor="end" fill="#d2a8ff" font-size="14" font-weight="700">1–2 GETs max</text>
  </g>
</svg>
