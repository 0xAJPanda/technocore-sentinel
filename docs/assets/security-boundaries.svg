<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Technocore Sentinel security boundaries</title>
  <desc id="desc">Sentinel permits bounded fixed-origin room reads, local deterministic scanning, sanitized reports, and secure cursor state while blocking content execution, URL following, arbitrary origins, background services, wallet access, and monitor writes.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg2)"/>
  <text x="60" y="62" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="30" font-weight="700">Security boundary: narrow by design</text>
  <text x="60" y="94" fill="#8b949e" font-family="system-ui, sans-serif" font-size="17">Remote room content stays untrusted data from input to output.</text>

  <g font-family="system-ui, sans-serif">
    <rect x="50" y="130" width="520" height="330" rx="20" fill="#12251a" stroke="#3fb950" stroke-width="2"/>
    <text x="82" y="172" fill="#7ee787" font-size="21" font-weight="700">ALLOWED</text>
    <text x="82" y="198" fill="#8b949e" font-size="14">Small, explicit, auditable capabilities</text>

    <g fill="#f0f6fc" font-size="16">
      <circle cx="92" cy="238" r="7" fill="#3fb950"/><text x="112" y="244">GET https://technocore.chat only</text>
      <circle cx="92" cy="284" r="7" fill="#3fb950"/><text x="112" y="290">Bounded validation before scanning</text>
      <circle cx="92" cy="330" r="7" fill="#3fb950"/><text x="112" y="336">Local deterministic safety rules</text>
      <circle cx="92" cy="376" r="7" fill="#3fb950"/><text x="112" y="382">Sanitized text or stable JSON reports</text>
      <circle cx="92" cy="422" r="7" fill="#3fb950"/><text x="112" y="428">Atomic 0600 cursor state under 0700 parent</text>
    </g>

    <rect x="630" y="130" width="520" height="330" rx="20" fill="#2a1719" stroke="#f85149" stroke-width="2"/>
    <text x="662" y="172" fill="#ff7b72" font-size="21" font-weight="700">NOT IN THE MONITOR</text>
    <text x="662" y="198" fill="#8b949e" font-size="14">Content cannot expand the tool's authority</text>

    <g fill="#f0f6fc" font-size="16">
      <circle cx="672" cy="238" r="7" fill="#f85149"/><text x="692" y="244">No command or content execution</text>
      <circle cx="672" cy="284" r="7" fill="#f85149"/><text x="692" y="290">No URL opening, DNS resolution, or fetching</text>
      <circle cx="672" cy="330" r="7" fill="#f85149"/><text x="692" y="336">No arbitrary origins, daemon, or webhook</text>
      <circle cx="672" cy="376" r="7" fill="#f85149"/><text x="692" y="382">No wallet, seed, identity key, or signing access</text>
      <circle cx="672" cy="422" r="7" fill="#f85149"/><text x="692" y="428">No Technocore writes from monitoring</text>
    </g>
  </g>

  <rect x="330" y="476" width="540" height="30" rx="15" fill="#1f6feb"/>
  <text x="600" y="497" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Findings are explainable heuristics—not proof of intent.</text>
</svg>
